services:

  # -------------------------
  # Apache Kafka
  # -------------------------
  kafka:
    image: apache/kafka:4.3.1
    container_name: icestream-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3


  # -------------------------
  # Flink JobManager
  # -------------------------
  flink-jobmanager:
    image: flink:1.20.3-scala_2.12-java17
    container_name: icestream-flink-jobmanager
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      - JOB_MANAGER_RPC_ADDRESS=flink-jobmanager


  # -------------------------
  # Flink TaskManager
  # -------------------------
  flink-taskmanager:
    image: flink:1.20.3-scala_2.12-java17
    container_name: icestream-flink-taskmanager
    depends_on:
      - flink-jobmanager
    command: taskmanager
    environment:
      - JOB_MANAGER_RPC_ADDRESS=flink-jobmanager


  # -------------------------
  # Iceberg REST Catalog
  # -------------------------
  iceberg-rest:
    image: apache/iceberg-rest-fixture:latest
    container_name: icestream-iceberg-rest
    ports:
      - "8181:8181"


  # -------------------------
  # MinIO - S3 compatible storage
  # -------------------------
  minio:
    image: minio/minio:latest
    container_name: icestream-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
    command: server /data --console-address ":9001"